services:
  caddy:
    image: caddy:2-alpine
    environment:
      INFRADECK_DOMAIN: ${INFRADECK_DOMAIN:?Set INFRADECK_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
